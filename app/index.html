<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Poster — comic cover art from your own photos</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="app">
  <aside class="rail rail-left">
    <header class="brand">
      <span class="brand-mark">VICE POSTER</span>
      <span class="brand-sub">comic cover art maker</span>
    </header>

    <section class="panel">
      <h2><i>1</i> Photos</h2>
      <label class="drop" id="dropzone">
        <input id="photo-input" type="file" accept="image/*" multiple>
        <b>Drop photos</b>
        <span>or click to pick — each one is cut into a sticker</span>
      </label>
      <div class="slot-grid" id="slot-grid" aria-label="Cut-outs"></div>
      <button id="fill-all" class="ghost wide" type="button">Fill every cut-out</button>
    </section>

    <section class="panel">
      <h2><i>2</i> Comic ink</h2>
      <label class="switch">
        <input id="ink-toggle" type="checkbox" checked>
        <span class="track"></span>
        <span>Comic ink <em>grade · posterise · outline · halftone</em></span>
      </label>
      <label class="range">Ink strength <output id="ink-value">85%</output>
        <input id="ink-strength" type="range" min="0" max="100" value="85">
      </label>
      <label class="range">Sticker border <output id="border-value">9 px</output>
        <input id="sticker-border" type="range" min="3" max="18" value="9">
      </label>
    </section>

    <section class="panel">
      <h2><i>3</i> Caption</h2>
      <label class="field">Title <input id="title-input" type="text" maxlength="26" autocomplete="off" spellcheck="false"></label>
      <label class="field">Subtitle <input id="subtitle-input" type="text" maxlength="48" autocomplete="off" spellcheck="false"></label>
      <label class="field">Credit line <input id="credit-input" type="text" maxlength="96" autocomplete="off" spellcheck="false"></label>
    </section>
  </aside>

  <main class="stage">
    <div class="toolbar" id="tool-row">
      <button type="button" class="tool is-on" data-tool="move">Move cut-outs</button>
      <button type="button" class="tool" data-tool="frame">Frame photo</button>
      <span class="spacer"></span>
      <button type="button" class="tool" id="compare-toggle">Before / after</button>
      <button type="button" class="tool" id="centre-cutout">Centre</button>
      <button type="button" class="tool" id="mirror-cutout">Mirror</button>
      <button type="button" class="tool" id="reset-frame">Reset</button>
    </div>

    <div class="board">
      <figure class="frame">
        <canvas id="poster" width="1080" height="1350" aria-label="Cover preview"></canvas>
        <figcaption id="preview-caption">Comic ink on · drag to move, scroll to zoom</figcaption>
      </figure>
      <figure class="frame frame-compare">
        <canvas id="compare-canvas" width="1080" height="1350" aria-label="The same cover with comic ink on"></canvas>
        <figcaption>Comic ink on</figcaption>
      </figure>
      <div class="result-view">
        <img id="result-image" alt="The exported cover, shown at the size it was written">
      </div>
    </div>
  </main>

  <aside class="rail rail-right">
    <h2><i>4</i> Export</h2>
    <div class="sizes" id="size-list"></div>
    <button id="export-button" class="primary" type="button">Export PNG</button>
    <button id="export-all" class="ghost wide" type="button">Export all three sizes</button>

    <div class="result-card">
      <p class="file" id="result-file">—</p>
      <p class="meta" id="result-meta">—</p>
      <div class="export-rows" id="result-sizes"></div>
      <a class="primary" id="download-link" download>Download PNG</a>
      <button id="back-to-editor" class="ghost wide" type="button">Back to editing</button>
    </div>

    <p class="status" id="status" role="status"></p>
    <p class="note">Every export is drawn again at full size — never scaled up from the preview. Photos never leave this machine.</p>
  </aside>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
